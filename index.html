<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YelloMark — Vendor Catalog Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="wordmark">
      <span class="wordmark-main">YelloMark</span>
      <span class="wordmark-sub">Vendor Catalog</span>
    </div>
    <div class="stat-line" id="statLine">Loading catalog…</div>
  </div>
</header>

<main>
  <section class="search-zone">
    <div class="search-zone-inner">
      <label class="search-label" for="searchInput">Find a product across every vendor</label>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Try “cap”, “notebook”, “gift box”, “bottle”…" autocomplete="off">
        <button id="clearBtn" class="clear-btn" aria-label="Clear search">Clear</button>
      </div>

      <div class="filters">
        <div class="filter-group" id="vendorFilters">
          <span class="filter-label">Vendor</span>
        </div>
        <div class="filter-group" id="categoryFilters">
          <span class="filter-label">Category</span>
        </div>
        <div class="filter-group sort-group">
          <span class="filter-label">Sort</span>
          <select id="sortSelect">
            <option value="relevance">Relevance</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section class="results-zone">
    <div class="results-inner">
      <div class="results-meta" id="resultsMeta"></div>
      <div class="results-grid" id="resultsGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p class="empty-title">No matches.</p>
        <p class="empty-sub">Try a broader term, or clear a filter above.</p>
      </div>
    </div>
  </section>
</main>

<div class="detail-overlay" id="detailOverlay" hidden>
  <div class="detail-panel" id="detailPanel"></div>
</div>

<footer class="site-footer">
  <span>Data refreshes automatically from the Master sheet.</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
